# One command: `docker compose up --build`, then open http://localhost:8080
# Uses the bundled 25% sample unless the full Olist CSVs are in ./data/raw.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logitrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logitrack}
      POSTGRES_DB: ${POSTGRES_DB:-logitrack}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-logitrack}:${POSTGRES_PASSWORD:-logitrack}@db:5432/${POSTGRES_DB:-logitrack}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-change-me}
      CORS_ORIGINS: http://localhost:8080
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-logitrack-demo}
    volumes:
      - ./data/raw:/data/raw:ro
      - models:/app/artifacts
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_DEMO_PASSWORD: ${DEMO_PASSWORD:-logitrack-demo}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  models:
