name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: logitrack
          POSTGRES_PASSWORD: logitrack
          POSTGRES_DB: logitrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logitrack" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://logitrack:logitrack@localhost:5432/logitrack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=app --cov=etl --cov=ml --cov-report=term --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    # Boots the whole stack from the bundled sample and checks it answers.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait --wait-timeout 600
      - run: curl --fail --silent http://localhost:8080/health
      - name: Log in through nginx and read the KPI summary
        run: |
          token=$(curl --fail -s -X POST http://localhost:8080/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"viewer@logitrack.dev","password":"logitrack-demo"}' | jq -r .access_token)
          curl --fail -s -H "Authorization: Bearer $token" http://localhost:8080/api/v1/kpi/summary | jq .
      - if: failure()
        run: docker compose logs api
